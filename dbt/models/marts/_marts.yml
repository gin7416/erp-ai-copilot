version: 2
# Column descriptions double as the semantic layer for Text-to-SQL: they are read by
# erp_copilot.semantic and placed in the LLM prompt, so they state business rules explicitly.
models:
  - name: dim_products
    description: 產品主檔，一列一個產品。
    columns:
      - name: product_id
        description: 產品代碼，例如 P001。
        data_tests: [unique, not_null]
      - name: sku
        description: 料號（已轉大寫並去除空白），例如 SSD-C1T-G4。
        data_tests: [unique, not_null]
      - name: product_name
        description: 產品名稱（英文），例如 'Client SSD 1TB PCIe Gen4'。
      - name: category
        description: 產品類別。
        data_tests:
          - accepted_values:
              arguments:
                values: ['SSD', 'Enterprise SSD', 'Controller', 'Memory Card', 'USB Drive', 'Portable SSD', 'Accessory']
      - name: supplier_id
        description: 主要供應商代碼，對應 dim_suppliers.supplier_id。
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_suppliers')
                field: supplier_id
      - name: unit_cost
        description: 標準單位成本（美元）。
      - name: list_price
        description: 牌價（美元）。
      - name: safety_stock
        description: 每個倉庫的安全庫存量（單位：個）。

  - name: dim_customers
    description: 客戶主檔，一列一個客戶。
    columns:
      - name: customer_id
        description: 客戶代碼，例如 C001。
        data_tests: [unique, not_null]
      - name: customer_name
        description: 客戶名稱（英文）。
      - name: region
        description: 客戶所在地區，中文值。
        data_tests:
          - accepted_values:
              arguments:
                values: ['台灣', '中國', '日本', '美國', '歐洲']
      - name: segment
        description: 客戶類型。
        data_tests:
          - accepted_values:
              arguments:
                values: ['OEM', '通路商', '企業客戶']

  - name: dim_suppliers
    description: 供應商主檔。
    columns:
      - name: supplier_id
        description: 供應商代碼，例如 S01。
        data_tests: [unique, not_null]
      - name: supplier_name
        description: 供應商名稱（英文）。
      - name: country
        description: 供應商所在國家，中文值，例如 台灣、日本、韓國、美國、中國、越南、馬來西亞。
      - name: nominal_lead_time_days
        description: 合約約定交期（天）。

  - name: dim_warehouses
    description: 倉庫主檔，共三個倉庫。
    columns:
      - name: warehouse_id
        description: 倉庫代碼 W01/W02/W03。
        data_tests: [unique, not_null]
      - name: warehouse_name
        description: 倉庫名稱：北區倉、中區倉、南區倉。
      - name: city
        description: 倉庫所在城市：桃園、台中、高雄。

  - name: fct_sales
    description: >
      銷售訂單明細，一列是一張訂單的一個品項（order_id + line_no）。
      計算營收、銷售額、銷量時必須排除 status = 'cancelled' 的訂單。
      「訂單數」請用 count(distinct order_id)。
    columns:
      - name: order_id
        description: 銷售訂單號，例如 SO00001。一張訂單可有多列。
        data_tests: [not_null]
      - name: line_no
        description: 訂單內的品項序號。
      - name: order_date
        description: 下單日期（DATE）。資料期間 2025-01-01 至 2026-06-30。
        data_tests: [not_null]
      - name: order_month
        description: 下單月份，為該月第一天（DATE），例如 2026-03-01 代表 2026 年 3 月。
      - name: ship_date
        description: 出貨日期；未出貨為 NULL。
      - name: status
        description: 訂單狀態：'shipped' 已出貨、'open' 未出貨（處理中）、'cancelled' 已取消。
        data_tests:
          - accepted_values:
              arguments:
                values: ['shipped', 'open', 'cancelled']
      - name: customer_id
        description: 客戶代碼，對應 dim_customers.customer_id。
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: product_id
        description: 產品代碼，對應 dim_products.product_id。
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: quantity
        description: 數量（個），一定大於 0。
      - name: unit_price
        description: 成交單價（美元）。
      - name: revenue
        description: 營收（美元）= quantity * unit_price。
      - name: cost
        description: 成本（美元）= quantity * 產品標準成本。
      - name: gross_margin
        description: 毛利（美元）= revenue - cost。毛利率 = sum(gross_margin) / sum(revenue)。

  - name: fct_purchase_orders
    description: 採購單，一列一張採購單（單一產品）。
    columns:
      - name: po_id
        description: 採購單號，例如 PO00001。
        data_tests: [unique, not_null]
      - name: supplier_id
        description: 供應商代碼，對應 dim_suppliers.supplier_id。
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_suppliers')
                field: supplier_id
      - name: product_id
        description: 產品代碼，對應 dim_products.product_id。
      - name: order_date
        description: 採購下單日期（DATE）。
      - name: expected_date
        description: 供應商承諾到貨日期（DATE）。
      - name: received_date
        description: 實際到貨日期；尚未到貨為 NULL。
      - name: quantity
        description: 採購數量（個）。
      - name: unit_cost
        description: 採購單價（美元）。
      - name: amount
        description: 採購金額（美元）= quantity * unit_cost。
      - name: status
        description: "'received' 已到貨、'open' 尚未到貨。"
        data_tests:
          - accepted_values:
              arguments:
                values: ['received', 'open']
      - name: actual_lead_time_days
        description: 實際交期（天）= received_date - order_date；未到貨為 NULL。
      - name: days_late
        description: 延遲天數 = received_date - expected_date；負數代表提早；未到貨為 NULL。
      - name: is_late
        description: 是否延遲到貨（received_date > expected_date）。準時率 = 1 - avg(is_late)，只計算 status = 'received'。

  - name: fct_inventory
    description: >
      每月月底庫存快照，一列是某倉庫某產品在 snapshot_date 的庫存。
      快照日期為 2026-01-31 至 2026-06-30 每月月底。
      問「目前／最新庫存」時，請只取 snapshot_date = (select max(snapshot_date) from marts.fct_inventory)。
    columns:
      - name: snapshot_date
        description: 快照日期（月底，DATE）。
        data_tests: [not_null]
      - name: warehouse_id
        description: 倉庫代碼，對應 dim_warehouses.warehouse_id。
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_warehouses')
                field: warehouse_id
      - name: product_id
        description: 產品代碼，對應 dim_products.product_id。
      - name: on_hand_qty
        description: 庫存數量（個）。
      - name: safety_stock
        description: 該產品每倉安全庫存量。
      - name: below_safety_stock
        description: 庫存是否低於安全庫存（on_hand_qty < safety_stock）。

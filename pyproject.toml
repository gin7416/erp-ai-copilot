[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "erp-ai-copilot"
version = "0.1.0"
description = "Local-LLM Text-to-SQL over dbt marts and RAG over SOP documents, with MCP tools, an Airflow pipeline and an evaluation harness (synthetic demo data)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "dbt-core>=1.10,<1.12",
    "dbt-duckdb>=1.9,<2",
    "sqlglot>=25",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
